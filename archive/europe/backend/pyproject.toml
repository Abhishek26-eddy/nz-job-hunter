[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "europe-job-agent"
version = "0.1.0"
description = "AI-powered Europe job discovery platform for DevOps/Platform engineers"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.8.0"
pydantic-settings = "^2.3.0"
sqlalchemy = {extras = ["asyncpg"], version = "^2.0.31"}
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
redis = "^5.0.0"
celery = {extras = ["redis"], version = "^5.4.0"}
httpx = "^0.27.0"
playwright = "^1.45.0"
google-generativeai = "^0.8.0"
sentence-transformers = "^3.0.0"
numpy = "^1.26.0"
pgvector = "^0.2.5"
pypdf = "^4.3.0"
reportlab = "^3.6.0"
python-docx = "^1.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
boto3 = "^1.34.0"
botocore = "^1.34.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.10.0"}
structlog = "^24.4.0"
tenacity = "^8.5.0"
email-validator = "^2.2.0"
feedparser = "^6.0.11"
beautifulsoup4 = "^4.12.3"
lxml = "^5.2.0"
python-dotenv = "^1.0.1"
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
factory-boy = "^3.3.0"
faker = "^26.0.0"
black = "^24.4.0"
ruff = "^0.5.0"
mypy = "^1.11.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.0"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
