name: Hunt NZ jobs

on:
  # The schedule is off: hunts run on the Mac (scripts/install_mac_schedule.sh)
  # because the SMTP secrets never reached this workflow. To move back to
  # GitHub, add the secrets and restore:
  # schedule:
  #   - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Only send a test email (checks the SMTP secrets)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -q

      - name: Check email settings
        # Prints only whether each setting exists, never its value.
        env:
          SECRET_SMTP_USER: ${{ secrets.SMTP_USER != '' }}
          SECRET_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD != '' }}
          SECRET_ALERT_TO: ${{ secrets.ALERT_TO != '' }}
          SECRET_ALERT_TO_WIFE: ${{ secrets.ALERT_TO_WIFE != '' }}
          VAR_SMTP_USER: ${{ vars.SMTP_USER != '' }}
          VAR_SMTP_PASSWORD: ${{ vars.SMTP_PASSWORD != '' }}
          VAR_ALERT_TO: ${{ vars.ALERT_TO != '' }}
          VAR_ALERT_TO_WIFE: ${{ vars.ALERT_TO_WIFE != '' }}
        run: |
          for name in SMTP_USER SMTP_PASSWORD ALERT_TO ALERT_TO_WIFE; do
            s="SECRET_$name"; v="VAR_$name"
            if [ "${!s}" = "true" ]; then echo "OK       $name is a repository secret"
            elif [ "${!v}" = "true" ]; then echo "::warning::$name is saved as a Variable, not a Secret. Delete it there and add it under Secrets."
            else echo "MISSING  $name (not a repository secret; check the name and that it is not an Environment secret)"
            fi
          done

      - name: Hunt
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_TO_WIFE: ${{ secrets.ALERT_TO_WIFE }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m hunter.run ${{ inputs.test_email && '--test-email' || '' }}

      - name: Save results
        if: ${{ !inputs.test_email }}
        run: |
          git config user.name "nz-job-hunter"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -q -m "hunt: $(python -c 'import json;m=json.load(open("data/meta.json"));print(m["new_this_run"],"new,",m["visa_ready_this_run"],"visa-ready")')"
          git pull -q --rebase
          git push -q
